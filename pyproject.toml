[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hmbuddy"
version = "0.1.0"
description = "HMBuddy Phase 1 — Local Office Artifact Runtime（本地 Office 文件统一读取运行时）"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1",
    "pdfplumber>=0.10",
    "openpyxl>=3.1",
    "python-pptx>=0.6.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "fpdf2>=2.7",
]

[tool.setuptools]
packages = ["workspace", "adapters", "services", "llm"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
