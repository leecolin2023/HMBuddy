[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hmbuddy"
version = "0.2.0"
description = "HMBuddy — Local Office Artifact Runtime with Desktop Entry"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1",
    "pdfplumber>=0.10",
    "openpyxl>=3.1",
    "python-pptx>=0.6.21",
    "PySide6>=6.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "fpdf2>=2.7",
    "xlrd>=2.0",
    "xlwt>=1.3",
]
# 遗留 Office 格式（.xls / .doc）；依赖均由适配器懒加载，缺省时给出明确报错
legacy = [
    "xlrd>=2.0",
    "pywin32>=305; sys_platform == 'win32'",
]
# 扫描件 OCR（PaddleOCR / SLANet 表格结构识别）；默认关闭，模型只从本地目录解析
ocr = [
    "paddleocr>=3.0",
    "paddlex>=3.0",
    "pypdfium2>=4",
    "pillow>=9",
    "numpy>=1.24",
]

[project.scripts]
hmbuddy-desktop = "desktop.app:main"

[tool.setuptools]
packages = [
    "workspace",
    "adapters",
    "adapters.ocr",
    "services",
    "llm",
    "application",
    "desktop",
    "plugin_runtime",
    "plugins",
    "plugins.docx",
    "plugins.doc_legacy",
    "plugins.pdf",
    "plugins.xlsx",
    "plugins.xls",
    "plugins.pptx",
    "plugins.text",
]

[tool.setuptools.package-data]
"*" = ["plugin.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
markers = [
    "windows_only: 依赖 Windows 平台语义（COM / 路径大小写不敏感），Linux CI 套件明确跳过（INT-008）",
]
