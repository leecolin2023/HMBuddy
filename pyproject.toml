[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hmbuddy"
version = "0.2.0"
description = "HMBuddy — Local Office Artifact Runtime with Desktop Entry"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1",
    "pdfplumber>=0.10",
    "openpyxl>=3.1",
    "python-pptx>=0.6.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "fpdf2>=2.7",
]

[project.scripts]
hmbuddy-desktop = "desktop.app:main"

[tool.setuptools]
packages = ["workspace", "adapters", "services", "llm", "desktop"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
